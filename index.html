<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>絶妖星乱舞 マクロ・ホットバー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e1a;
    --bg-2:#0f1626;
    --panel:rgba(18,26,44,.82);
    --panel-2:rgba(12,18,32,.9);
    --slot:#141d31;
    --slot-hi:#1d2a45;
    --border:#2c3a5c;
    --gold:#c9a86a;
    --gold-soft:#e2cd9a;
    --cyan:#7fd7e8;
    --cyan-dim:#5a9fb0;
    --text:#e7ecf5;
    --muted:#8a97b3;
    --red:#e0594f;
    --yellow:#e0c24f;
    --blue:#4fa8e0;
    --purple:#a96fe0;
    --teal:#5fc7b0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(201,168,106,.08), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(79,168,224,.07), transparent 60%),
      linear-gradient(160deg,var(--bg),var(--bg-2));
    color:var(--text);
    font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100%;
    padding:18px clamp(12px,3vw,28px) 40px;
  }
  .wrap{max-width:1280px;margin:0 auto}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .title h1{
    font-family:"Cinzel",serif;letter-spacing:.06em;
    font-size:clamp(20px,3.4vw,30px);margin:0;font-weight:600;
    color:var(--gold-soft);
    text-shadow:0 1px 0 #000,0 0 24px rgba(201,168,106,.25);
  }
  .title p{margin:4px 0 0;color:var(--muted);font-size:13px;letter-spacing:.02em}
  .actions{display:flex;gap:8px}
  button{font-family:inherit;cursor:pointer}
  .btn{
    background:var(--panel-2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:9px 14px;font-size:13px;font-weight:500;
    transition:border-color .15s,background .15s,transform .05s;
  }
  .btn:hover{border-color:var(--gold);background:var(--slot-hi)}
  .btn:active{transform:translateY(1px)}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
  .tab{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:999px;padding:8px 18px;font-size:14px;font-weight:500;letter-spacing:.03em;
    transition:all .15s;
  }
  .tab:hover{color:var(--text);border-color:var(--gold)}
  .tab[aria-selected="true"]{
    background:linear-gradient(180deg,var(--gold),#b18f4f);
    color:#1a1306;border-color:var(--gold);font-weight:700;
    box-shadow:0 4px 16px rgba(201,168,106,.25);
  }

  .layout{display:grid;grid-template-columns:minmax(380px,560px) minmax(0,1fr);gap:22px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}

  .group{margin-bottom:22px}
  .group-label{
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);
    border-left:3px solid var(--gold);padding-left:9px;margin:0 0 11px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .group-label small{color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px;font-weight:400}
  .bar{display:flex;flex-wrap:wrap;gap:10px}

  .slot{
    width:82px;height:92px;background:linear-gradient(180deg,var(--slot),#0e1525);
    border:1px solid var(--border);border-radius:9px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:10px 4px 6px;gap:7px;position:relative;overflow:hidden;
    transition:transform .07s,border-color .15s,box-shadow .15s;
    color:var(--text);text-align:center;
  }
  .slot:hover{border-color:var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 0 1px rgba(201,168,106,.25) inset;transform:translateY(-2px)}
  .slot:active{transform:translateY(0)}
  .slot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .slot.running{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 22px rgba(201,168,106,.5)}
  /* when() 判定為不可能的按鈕：留在原位變灰，不重排版面 */
  .slot:disabled{opacity:.24;filter:grayscale(.8);cursor:not-allowed}
  .slot:disabled:hover{border-color:var(--border);box-shadow:none;transform:none}

  .icon{
    width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:18px;color:#0c0c0c;flex:none;
    box-shadow:0 2px 6px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.18) inset;
    font-family:"Cinzel",serif;
  }
  .icon.sm{font-size:11px;letter-spacing:-.02em}
  .ic-A,.ic-1{background:radial-gradient(circle at 35% 30%,#ff8b80,var(--red))}
  .ic-B,.ic-2{background:radial-gradient(circle at 35% 30%,#f4dd86,var(--yellow))}
  .ic-C,.ic-3{background:radial-gradient(circle at 35% 30%,#8fcbf4,var(--blue))}
  .ic-D,.ic-4{background:radial-gradient(circle at 35% 30%,#cca0f4,var(--purple))}
  .ic-ref{background:radial-gradient(circle at 35% 30%,#9be3d2,var(--teal))}
  .ic-ok{background:radial-gradient(circle at 35% 30%,#a8e6a0,#4ea85e)}
  .ic-ng{background:radial-gradient(circle at 35% 30%,#d6d6d6,#6b7280)}
  .slot .name{font-size:11px;line-height:1.25;color:var(--muted)}
  .slot:hover .name{color:var(--text)}
  .slot .key{
    position:absolute;top:3px;left:4px;font-size:10px;line-height:1;
    color:var(--gold-soft);opacity:.9;text-shadow:0 1px 2px #000;
    background:rgba(8,12,24,.78);border-radius:4px;padding:2px 4px;
    pointer-events:none;letter-spacing:.02em;
  }

  .chat-wrap{position:sticky;top:14px}
  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    backdrop-filter:blur(6px);overflow:hidden;
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,rgba(201,168,106,.1),transparent);
  }
  .panel-head h2{margin:0;font-size:14px;letter-spacing:.05em;color:var(--gold-soft);font-weight:700}
  .log{
    height:min(70vh,720px);overflow:auto;padding:14px 16px;
    font-family:"Noto Sans Mono CJK JP","Source Han Mono","HiraMaxMinPro-W3","Osaka-Mono","MS Gothic",ui-monospace,monospace;
    font-size:16px;line-height:1.6;
  }
  .log::-webkit-scrollbar{width:11px;height:11px}
  .log::-webkit-scrollbar-thumb{background:#243150;border-radius:6px}
  .line{white-space:pre;margin:2px 0;animation:fade .16s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
  .line.party{color:var(--cyan)}
  .line.party::before{content:"[1] ";color:var(--cyan-dim)}
  .line.system{color:#b7c0a0}
  .line.system::before{content:"\2691 ";color:#8a9470}
  .chat-img{
    display:block;max-width:100%;height:auto;border-radius:10px;
    border:1px solid var(--border);margin:8px 0 4px;
    box-shadow:0 6px 20px rgba(0,0,0,.45);
  }
  .img-fallback{color:var(--muted);font-style:italic}
  .img-fallback a{color:var(--cyan)}
  .empty{color:var(--muted);font-style:italic;white-space:normal}

  /* P4 タイムライン：10 欄對位表。
     原文靠半形空格對齊，那是照遊戲內字型 17 調的，網頁字型一定歪；
     所以改成 grid 固定欄位，欄位歸屬寫在 macro.tl。 */
  .tl-wrap{overflow-x:auto;margin:2px 0 4px;padding-bottom:2px}
  .tl{display:grid;grid-template-columns:repeat(10,auto);width:max-content;font-size:15px;line-height:1.5}
  .tl-c{padding:.2em .5em;text-align:center;white-space:nowrap;color:var(--cyan)}
  .tl-c.sep{border-right:1px solid #3a4a70}
  .tl-c.h1{color:var(--muted);font-size:.85em}
  .tl-c.h2{color:var(--gold-soft);font-weight:700}
  .tl-c.rule{padding:0;height:0;border-bottom:1px solid #3a4a70;margin:3px 0}
  .tl-c.val{font-weight:700;animation:fade .16s ease}

  /* 全寬特例：寬度=整個頁面內容區，置於熱鍵列上方，不影響按鈕排版 */
  .wideview{display:none;margin:0 0 18px}
  .wideview.show{display:block;animation:fade .18s ease}
  .wideview a{display:block;line-height:0}
  .wideview img{
    display:block;width:100%;height:auto;border-radius:10px;
    border:1px solid var(--border);box-shadow:0 8px 26px rgba(0,0,0,.5);
  }
  .wideview .cap{font-size:12px;color:var(--muted);margin:6px 2px 0;line-height:1.4}

  .hint{color:var(--muted);font-size:12px;margin:14px 2px 0;line-height:1.6}
  .hint b{color:var(--gold-soft);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>絶妖星乱舞 — マクロ・ホットバー</h1>
    </div>
    <div class="actions">
      <button class="btn" id="clearBtn">🗑 清除聊天</button>
    </div>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="wideview" id="wideview" aria-live="polite"></div>

  <div class="layout">
    <div class="chat-wrap">
      <div class="panel">
        <div class="panel-head">
          <h2>パーティチャット</h2>
        </div>
        <div class="log" id="log"></div>
      </div>
    </div>

    <div id="bars"></div>
  </div>
</div>

<script>
/* ============================================================
   マクロデータ —— 新增/修改宏只要改這個陣列。
   icon : {label, type}  type 對應顏色 (A B C D 1 2 3 4 / ref)
   raw  : 宏原文（含 /p /micon 等），引擎會自行解析。
   image: {src, alt}  —— 按下時把圖片貼進聊天（可與 raw 並用）。
   tl   : P4 時間軸專用。"head" ＝印出表頭；物件 ＝往表下疊一行，
          key 用 TL_COLS 的 k（we/aew/aeg/g1/fire/wl/alw/alg/g2/tsu）。
          有 tl 的宏，raw 只作為遊戲內原文保存、不參與渲染。
   autorun : true ＝切到該分頁時自動執行一次（多顆會依出現順序全跑）。
   hidden  : true ＝不畫按鈕，只靠 autorun／鍵盤觸發。整組都 hidden 時該組不顯示。
   stage（群組屬性）: 2＝P4 六按完成後才顯示的按鈕組（雷冰記憶）；不寫＝1。
   mark : {id,text} —— 按下時在表格最下方印「橫線＋一行字」；同 id 重按原地更新那行字。
   clearFirst : 預設 true —— 按下時先清空聊天（模擬 /clear），FF14 一般宏的行為。
          設成 false ＝「累加式」宏：不清空，直接往現有內容下方疊加。
          用在 P4 時間軸這種「開始鍵印表頭、之後每按一次疊一行」的宏。
   key  : 鍵盤快捷鍵，如 "q"、"3"、"shift+q"（可加 ctrl/alt/shift）；
          給陣列＝同一顆多重鍵位，如 ["shift+q","a"]。
          只在該分頁顯示中時生效，會顯示在按鈕左上角。
   when : ()=>bool，回傳 false 時該按鈕變灰且按不下去（鍵盤也擋）。
   sets : 執行後寫入 tlState。物件＝直接覆蓋；函式＝自訂（見 setPair）。
   群組屬性 cols:4 —— 該組按鈕固定 4 欄排列（8 顆＝上下兩排）。
   ============================================================ */

/* ---------- P4 時間軸狀態：用來鎖住不可能的按鈕 ----------
   gc1 / gc2   ：兩次大十字的真假（true＝真）
   waterFirst  ：③ 已經按掉哪一欄（"we"＝早／"wl"＝晚）
   chaosFirst  ：② 已經按掉哪個機制（"fire"／"tsu"）
   waterBoth / chaosBoth ：該對的兩邊都按過了（四者集齊＝六按完成→切到雷冰按鈕）
   按「開始」（切 P4 分頁或按 0）會整組重置。 */
let tlState={ gc1:null, gc2:null, waterFirst:null, chaosFirst:null, waterBoth:false, chaosBoth:false };
const setPair=(fk,bk,v)=>s=>{ if(s[fk]===null) s[fk]=v; else if(s[fk]!==v) s[bk]=true; };   // 第一次記 fk；按到另一邊時立 bk

/* ③ 早晚水雷：第3按跟 GC1 的真假、第5按跟 GC2 的；按過的欄位直接鎖死。
   注意：「水雷真假＝該次 GC 真假」是從 yan-flash 的用詞（GC1回目の真偽）推的，攻略沒明寫。
   若實戰發現推錯，重按 ①／④ 的另一顆即可改判，或按 0 整組重置。 */
function waterOK(col,truth){
  const s=tlState;
  if(s.waterFirst===null) return s.gc1===null || s.gc1===truth;   // 這是第3按
  if(s.waterFirst===col)  return false;                            // 這欄填過了
  return s.gc2===null || s.gc2===truth;                            // 這是第5按
}
/* ② 炎・海嘯：第2按兩種都行，第6按只剩另一種。真假各自獨立觀察，不過濾。 */
function chaosOK(mech){ return tlState.chaosFirst===null || tlState.chaosFirst!==mech; }

`/p -----------------------------------

/p  7 : 3B |　　　Ｄ　　　Ｃ
/p  8 : B2 |　　　　④　⑤
/p    　　　　　　　　４
/micon "2" Waymark` },
      { name:"基準 3", icon:{label:"3",type:"3"}, key:"3", raw:
`/p -----------------------------------
/p  1 : 3B |　　　　　３
/p  2 : B2 |　　　　①　⑧
/p  3 : 2A |　　　Ｂ　　　Ｃ

/* ===================== 引擎 ===================== */
const $ = s => document.querySelector(s);
const logEl = $("#log");
const wideEl = $("#wideview");

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function renderChips(s){return escapeHtml(s).replace(/《([^》]*)》/g,'<span class="chip">$1</span>');}

function parseMacro(raw){
  const steps=[];
  raw.split("\n").forEach(line=>{
    if(line.startsWith("/p")){
      let t=line.replace(/^\/p ?/,"");
      t=t.replace(/<se\.\d+>/g,"").replace(/<wait\.[\d.]+>/g,"");
      steps.push({type:"chat",text:t});
    } else if(line.startsWith("/mk")){
      const p=line.split(/\s+/);
      steps.push({type:"system",text:`マーカー設置: ${p[1]||""}（自分）`});
    }
    // /micon /mlock /cl /clear は出力なし
    //   ※ /cl の「清空」動作は macro.clearFirst（預設 true）負責，不在這裡處理
  });
  return steps;
}

function clearEmpty(){ const e=logEl.querySelector(".empty"); if(e) logEl.innerHTML=""; }
function appendLine(html,cls){
  clearEmpty();
  const d=document.createElement("div");
  d.className="line "+cls; d.innerHTML=html;
  logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight;
}
function appendImage(img){
  clearEmpty();
  const el=document.createElement("img");
  el.className="chat-img"; el.src=img.src; el.alt=img.alt||""; el.loading="lazy";
  el.onerror=()=>{
    const f=document.createElement("div");
    f.className="line img-fallback";
    f.innerHTML='圖片載入失敗（可能被原站擋外連）。<a href="'+escapeHtml(img.src)+'" target="_blank" rel="noopener">點此開啟原圖</a>';
    el.replaceWith(f); logEl.scrollTop=logEl.scrollHeight;
  };
  logEl.appendChild(el); logEl.scrollTop=logEl.scrollHeight;
}

/* ---------- P4 時間軸：10 欄對位渲染 ----------
   sep:true ＝該欄右側畫分隔線，對應原文的 "|"。
   w ＝該欄最小寬度（em，約等於幾個全形字）。
   欄名與內容都已中文化；日文原文只留在各宏的 raw。 */
const TL_COLS=[
  {k:"we",  label:"早水雷", w:3},
  {k:"aew", label:"水雷",   w:2},
  {k:"aeg", label:"視線",   w:2, sep:true},
  {k:"g1",  label:"視線1",  w:3, sep:true},
  {k:"fire",label:"炎",     w:2, sep:true},
  {k:"wl",  label:"晚水雷", w:3},
  {k:"alw", label:"水雷",   w:2},
  {k:"alg", label:"視線",   w:2, sep:true},
  {k:"g2",  label:"視線2",  w:3, sep:true},
  {k:"tsu", label:"海嘯",   w:2}
];
function tlGrid(){
  let g=logEl.querySelector(".tl");
  if(!g){
    clearEmpty();
    const w=document.createElement("div"); w.className="tl-wrap";
    g=document.createElement("div"); g.className="tl";
    w.appendChild(g); logEl.appendChild(w);
  }
  return g;
}
/* 表格若比聊天欄寬就逐級縮小字級（15px 起、最低 10px），消除橫向捲動。
   對齊不受影響：表頭與資料列都是同一個 grid 的格子，欄位對位是結構性的。 */
function tlFit(){
  const w=logEl.querySelector(".tl-wrap"), g=logEl.querySelector(".tl");
  if(!w||!g) return;
  let fs=15; g.style.fontSize=fs+"px";
  while(fs>10 && w.scrollWidth>w.clientWidth){ fs--; g.style.fontSize=fs+"px"; }
}
window.addEventListener("resize",tlFit);
function tlCell(g,text,cls,col,span){
  const d=document.createElement("div");
  d.className="tl-c"+(cls?" "+cls:"")+(col&&col.sep?" sep":"");
  if(col) d.style.minWidth=col.w+"em";
  if(span) d.style.gridColumn="span "+span;
  d.textContent=text||"";
  g.appendChild(d); return d;
}
function tlRule(){ const g=tlGrid(); tlCell(g,"","rule",null,TL_COLS.length); }
function tlRow(cells,cls){
  const g=tlGrid();
  TL_COLS.forEach(c=>tlCell(g,cells[c.k],cls,c));
  tlFit();
  logEl.scrollTop=logEl.scrollHeight;
}
/* 雷冰記憶列：在表格最下方印「橫線＋一行字」（跟表頭的分隔線同款）。
   同 id 重按只更新文字，不重複疊行。 */
function tlMark(mk){
  const g=tlGrid();
  let row=g.querySelector('[data-mark="'+mk.id+'"]');
  if(!row){
    tlRule();
    row=document.createElement("div");
    row.className="tl-c val";
    row.style.gridColumn="span "+TL_COLS.length;
    row.style.textAlign="left";
    row.setAttribute("data-mark",mk.id);
    g.appendChild(row);
  }
  row.textContent=mk.text;
  tlFit();
  logEl.scrollTop=logEl.scrollHeight;
}
function tlHeader(){
  tlRule();
  const g=tlGrid();
  // 上層跨欄標題：早加速／遅加速 各蓋住「水雷・視線」兩欄
  tlCell(g,"","h1",TL_COLS[0]);
  tlCell(g,"早加速","h1 sep",null,2);
  tlCell(g,"","h1",TL_COLS[3]);
  tlCell(g,"","h1",TL_COLS[4]);
  tlCell(g,"","h1",TL_COLS[5]);
  tlCell(g,"晚加速","h1 sep",null,2);
  tlCell(g,"","h1",TL_COLS[8]);
  tlCell(g,"","h1",TL_COLS[9]);
  tlRow(Object.fromEntries(TL_COLS.map(c=>[c.k,c.label])),"h2");
  tlRule();
}

function clearLog(){
  logEl.innerHTML="";
  wideEl.innerHTML=""; wideEl.classList.remove("show");
}

function showWide(img){
  wideEl.innerHTML="";
  const a=document.createElement("a");
  a.href=img.src; a.target="_blank"; a.rel="noopener";
  const el=document.createElement("img");
  el.src=img.src; el.alt=img.alt||""; el.loading="lazy";
  el.onerror=()=>{
    wideEl.innerHTML='<div class="img-fallback" style="padding:10px">圖片載入失敗：請確認 P3.jpg 與 index.html 放在同一層、且檔名大小寫一致。</div>';
    wideEl.classList.add("show");
  };
  a.appendChild(el); wideEl.appendChild(a);
  const cap=document.createElement("div");
  cap.className="cap"; cap.textContent="點圖可開新分頁放大";
  wideEl.appendChild(cap);
  wideEl.classList.add("show");
  wideEl.scrollIntoView({behavior:"smooth",block:"nearest"});
}

// slot 可為 null（hidden 宏沒有按鈕，但仍可被 autorun／鍵盤觸發）
function flashSlot(slot){ if(!slot) return; slot.classList.add("running"); setTimeout(()=>slot.classList.remove("running"),320); }

function runMacro(macro,slot){
  if(macro.when && !macro.when()) return;   // 已鎖住：滑鼠被 disabled 擋，鍵盤在這裡擋
  flashSlot(slot);
  // 預設每個宏開頭先清空對話框（模擬 /clear）；clearFirst:false ＝累加式，往下疊加
  if(macro.clearFirst !== false) clearLog();
  // 表頭＝一輪的開始，順便把鎖定狀態整組重置
  if(macro.tl==="head") tlState={ gc1:null, gc2:null, waterFirst:null, chaosFirst:null, waterBoth:false, chaosBoth:false };
  if(macro.image){
    if(macro.image.wide) showWide(macro.image);
    else appendImage(macro.image);
  }
  if(macro.tl){
    // P4 時間軸：走欄位化渲染，raw 只是原文保存
    if(macro.tl==="head") tlHeader();
    else tlRow(macro.tl,"val");
  } else if(macro.mark){
    tlMark(macro.mark);
  } else if(macro.raw){
    parseMacro(macro.raw).forEach(s=>{
      if(s.type==="chat") appendLine(renderChips(s.text)||"&nbsp;","party");
      else if(s.type==="system") appendLine(escapeHtml(s.text),"system");
    });
  }
  if(macro.sets){
    if(typeof macro.sets==="function") macro.sets(tlState);
    else Object.assign(tlState,macro.sets);
  }
  p4CheckStage();
  refreshSlots();
}

/* ---------- 鍵盤快捷鍵：macro.key（"a"、"shift+3"…），只對目前顯示的分頁生效 ---------- */
let keyMap=[];     // renderBars 時重建：[{spec, macro, slot}]
let slotRefs=[];   // renderBars 時重建：[{macro, slot}]，refreshSlots 用它切鎖定狀態
// 依 macro.when() 更新按鈕可按狀態。不能改用 renderBars 重畫——那會觸發 autorun 把表頭重印、時間軸整個清掉
function refreshSlots(){
  slotRefs.forEach(r=>{ if(r.slot && r.macro.when) r.slot.disabled = !r.macro.when(); });
}
function parseKey(spec){
  const parts=spec.toLowerCase().split("+"), key=parts.pop();
  let codes=[key];
  if(/^[a-z]$/.test(key)) codes=["Key"+key.toUpperCase()];
  else if(/^[0-9]$/.test(key)) codes=["Digit"+key,"Numpad"+key];
  else if(/^f([1-9]|1[0-2])$/.test(key)) codes=[key.toUpperCase()];
  return {codes,ctrl:parts.includes("ctrl"),alt:parts.includes("alt"),shift:parts.includes("shift")};
}
function keyLabel(spec){
  return spec.split("+").map(p=>({ctrl:"Ctrl+",alt:"Alt+",shift:"⇧"}[p.toLowerCase()]||p.toUpperCase())).join("");
}
document.addEventListener("keydown",e=>{
  if(e.repeat||e.metaKey) return;
  const t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
  const hit=keyMap.find(k=>k.spec.codes.includes(e.code)&&e.ctrlKey===k.spec.ctrl&&e.altKey===k.spec.alt&&e.shiftKey===k.spec.shift);
  if(hit){ e.preventDefault(); runMacro(hit.macro,hit.slot); }
});

/* ===================== 介面 ===================== */
const tabsEl=$("#tabs"), barsEl=$("#bars");
function buildTabs(){
  PHASES.forEach((ph,idx)=>{
    const b=document.createElement("button");
    b.className="tab"; b.textContent=ph.label; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", idx===0?"true":"false");
    b.onclick=()=>selectPhase(idx);
    tabsEl.appendChild(b);
  });
}
function selectPhase(idx){
  [...tabsEl.children].forEach((t,i)=>t.setAttribute("aria-selected",i===idx?"true":"false"));
  renderBars(PHASES[idx]);
}
let currentPhase=null;
let p4Stage=1;   // P4 按鈕階段：1＝時間軸六按，2＝雷冰記憶（六按完成後）
// 六按全齊（gc1、gc2、水雷兩邊、火水兩邊）→ 換到第 2 階段按鈕；按 0 重置會換回來
function p4CheckStage(){
  if(!currentPhase || currentPhase.id!=="p4") return;
  const want=(tlState.gc1!==null && tlState.gc2!==null && tlState.waterBoth && tlState.chaosBoth)?2:1;
  if(want!==p4Stage){ p4Stage=want; renderBars(currentPhase,{autorun:false}); }
}
function renderBars(phase,opts){
  const fresh=!opts||opts.autorun!==false;   // fresh＝換分頁；階段切換傳 {autorun:false}，不重跑 autorun 才不會清掉表格
  currentPhase=phase;
  if(fresh) p4Stage=1;
  barsEl.innerHTML="";
  keyMap=[]; slotRefs=[];
  const auto=[];
  phase.groups.forEach(g=>{
    // 非當前階段的組不畫也不註冊鍵；全 hidden 的系統組（表頭）例外，鍵盤永遠有效
    if((g.stage||1)!==p4Stage && !g.macros.every(m=>m.hidden)) return;
    const wrap=document.createElement("div"); wrap.className="group";
    const lbl=document.createElement("div"); lbl.className="group-label";
    lbl.innerHTML=`${escapeHtml(g.label)}${g.note?` <small>${escapeHtml(g.note)}</small>`:""}`;
    wrap.appendChild(lbl);
    const bar=document.createElement("div"); bar.className="bar";
    if(g.cols){ bar.style.display="grid"; bar.style.gridTemplateColumns=`repeat(${g.cols},max-content)`; }
    g.macros.forEach(m=>{
      const keys=m.key?(Array.isArray(m.key)?m.key:[m.key]):[];
      let slot=null;
      if(!m.hidden){
        slot=document.createElement("button");
        slot.className="slot"; slot.type="button";
        slot.title=keys.length?`${m.name}（鍵盤：${keys.map(keyLabel).join(" / ")}）`:m.name;
        const icl=String(m.icon.label).length>2?"icon sm":"icon";
        slot.innerHTML=`<span class="${icl} ic-${m.icon.type}">${escapeHtml(m.icon.label)}</span><span class="name">${escapeHtml(m.name)}</span>`
          +(keys.length?`<span class="key">${escapeHtml(keys.map(keyLabel).join("·"))}</span>`:"");
        slot.onclick=()=>runMacro(m,slot);
        bar.appendChild(slot);
      }
      keys.forEach(k=>keyMap.push({spec:parseKey(k),macro:m,slot}));
      slotRefs.push({macro:m,slot});
      if(m.autorun && fresh) auto.push({macro:m,slot});
    });
    if(bar.children.length){ wrap.appendChild(bar); barsEl.appendChild(wrap); }  // 整組都 hidden 就不畫這一組
  });
  auto.forEach(a=>runMacro(a.macro,a.slot));   // 切分頁時自動執行
  refreshSlots();                              // 沒有 autorun 的分頁也要套一次
}

$("#clearBtn").onclick=()=>{ clearLog(); };

buildTabs();
selectPhase(0);
</script>
</body>
</html>
